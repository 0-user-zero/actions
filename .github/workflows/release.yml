# Pushing a tag like v1.2.3 publishes a release and moves the major tag (v1) to it, so workflows that use @v1 get the update.
name: Release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test
      - name: Move the major tag
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          git tag -f "$major"
          git push -f origin "$major"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"
